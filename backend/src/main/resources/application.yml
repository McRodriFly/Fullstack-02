spring:
  application:
    name: audi-f1-api
  config:
    # Credenciales desde el .env de la raíz del repo (según desde dónde se ejecute el backend).
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:audi_f1_store}?serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:audi}
    password: ${DB_PASSWORD}
  web:
    # Fija el idioma para que los mensajes de validación (Hibernate Validator) salgan en español.
    locale: es-CL
    locale-resolver: fixed
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crea Flyway; Hibernate solo lo valida.
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080

app:
  jwt:
    # Clave HMAC-SHA256 en Base64 (mínimo 32 bytes), desde el .env. Sin ella la aplicación no arranca.
    secreto: ${JWT_SECRET:}
    duracion-acceso: 15m
    duracion-refresco: 7d

springdoc:
  swagger-ui:
    path: /swagger-ui.html
