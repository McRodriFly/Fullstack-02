server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true # Descubrimiento automático vía Eureka
      routes:
        - id: service-productos
          uri: lb://service-productos
          predicates:
            - Path=/api/v1/productos/**
          filters:
            - RewritePath=/api/v1/productos/(?<segment>.*), /productos/{segment}
            - RewritePath=/api/v1/productos, /productos

        - id: service-usuarios
          uri: lb://service-usuarios
          predicates:
            - Path=/api/v1/usuarios/**
          filters:
            - RewritePath=/api/v1/usuarios/(?<segment>.*), /usuarios/{segment}
            - RewritePath=/api/v1/usuarios, /usuarios

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
